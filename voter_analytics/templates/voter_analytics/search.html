Author: Tim Nguyen (tim7@bu.edu), 10/30/2026
Description: Search for Voter options
{% endcomment %}

<form action="{% url 'voters' %}" method="GET">
  <label>Party:
    <select name="party">
      <option value="">Any</option>
      {% for p in parties %}
        <option value="{{ p }}" {% if p == request.GET.party %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Born after (min year):
    <select name="min_dob">
      <option value="">Any</option>
      {% for y in years %}
        <option value="{{ y }}" {% if y == request.GET.min_dob %}selected{% endif %}>{{ y }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Born before (max year):
    <select name="max_dob">
      <option value="">Any</option>
      {% for y in years %}
        <option value="{{ y }}" {% if y == request.GET.max_dob %}selected{% endif %}>{{ y }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Voter score:
    <select name="voter_score">
      <option value="">Any</option>
      {% for s in scores %}
        <option value="{{ s }}" {% if s == request.GET.voter_score %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>

  <p>Voted in:
    <label><input type="checkbox" name="v20state"   {% if request.GET.v20state %}checked{% endif %}> 2020 State</label>
    <label><input type="checkbox" name="v21town"    {% if request.GET.v21town %}checked{% endif %}> 2021 Town</label>
    <label><input type="checkbox" name="v21primary" {% if request.GET.v21primary %}checked{% endif %}> 2021 Primary</label>
    <label><input type="checkbox" name="v22general" {% if request.GET.v22general %}checked{% endif %}> 2022 General</label>
    <label><input type="checkbox" name="v23town"    {% if request.GET.v23town %}checked{% endif %}> 2023 Town</label>
  </p>

  <input type="submit" value="Search">
  <a href="{% url 'voters' %}">Clear filters</a>
</form>
